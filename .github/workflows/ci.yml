name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Fe 26.5.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh -o /tmp/feup.sh
          bash /tmp/feup.sh --version v26.5.0 --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"

      - name: Check Fe version
        run: fe --version

      - name: Format check
        run: fe fmt --check

      - name: Type check
        run: fe check

      - name: Test (sonatina backend)
        run: fe test

      - name: Test (native backend)
        run: fe test --backend native

# NOTE: `fe build` is intentionally NOT run here. FeDSP is a pure library
# with no contracts, and `fe build` exits 1 with "No contracts found to
# build". The library is verified by `fe check` + `fe test` on both
# backends, which is the complete build surface for this ingot.
